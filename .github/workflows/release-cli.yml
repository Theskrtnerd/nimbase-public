name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'Theskrtnerd/nimbase-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install OIDC-capable npm
        run: npm install --global "npm@^11.5.1"

      - name: Verify release tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          test "$GITHUB_REF_NAME" = "cli-v$VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build CLI
        run: |
          pnpm --filter ./apps/cli lint
          pnpm --filter ./apps/cli typecheck
          pnpm --filter ./apps/cli test
          pnpm --filter ./apps/cli build

      - name: Pack CLI
        run: pnpm --filter ./apps/cli pack --out "$RUNNER_TEMP/nimbase-%v.tgz"

      - name: Publish CLI
        run: npm publish "$RUNNER_TEMP/nimbase-${{ steps.version.outputs.version }}.tgz" --access public
