name: Release Connector SDK

on:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'Theskrtnerd/nimbase-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install OIDC-capable npm
        run: npm install --global "npm@^11.5.1"

      - name: Verify release tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/connector-sdk/package.json').version")"
          test "$GITHUB_REF_NAME" = "connector-v$VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build Connector SDK
        run: |
          pnpm --filter @nimbase/connector-sdk lint
          pnpm --filter @nimbase/connector-sdk typecheck
          pnpm --filter @nimbase/connector-sdk test
          pnpm --filter @nimbase/connector-sdk build

      - name: Pack Connector SDK
        run: pnpm --filter @nimbase/connector-sdk pack --out "$RUNNER_TEMP/nimbase-connector-sdk-%v.tgz"

      - name: Publish Connector SDK
        run: npm publish "$RUNNER_TEMP/nimbase-connector-sdk-${{ steps.version.outputs.version }}.tgz" --access public
